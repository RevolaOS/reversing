name: symbols
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check tools && ruff format --check tools
      - run: python tools/symbols.py check symbols/osos-2.0.5
      - run: python tools/symbols.py verify symbols/osos-2.0.5
