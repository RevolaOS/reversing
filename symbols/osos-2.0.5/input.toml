# Click wheel and buttons.

[functions]
Wheel_HandleInterrupt = { at = 0x0805f688 }
Wheel_RunTask = { at = 0x0805f738 }
Wheel_DispatchButtonChanges = { at = 0x0807443c, c = "int Wheel_DispatchButtonChanges(int force_center)" }
Input_HandleButton = { at = 0x08056900, c = "void Input_HandleButton(uint32_t button, uint32_t pressed)" }
HoldSwitch_NotifyRawChange = { at = 0x080c75f8 }
Event_Signal = { at = 0x0802cfa8, c = "void Event_Signal(uint32_t event)" }
IRQ_RestoreState = { at = 0x083924d8, c = "void IRQ_RestoreState(uint32_t cpsr)" }
IRQ_DisableSave = { at = 0x083924e0, c = "uint32_t IRQ_DisableSave(void)" }
InputWheel_AccumulateMotion = { at = 0x08093718 }

[sites]
HoldSwitch_NotifyRawChange_call = { at = 0x08055b44, kind = "call" }

[data]
WheelController = { at = 0x3c200000, c = "volatile uint32_t WheelController[]" }
WheelState = { at = 0x089d2b8c, c = "uint8_t WheelState[]" }
ButtonKeyCodes = { at = 0x089d2ec5, c = "const uint8_t ButtonKeyCodes[5]" }

[offsets.WheelState]
notify_pending = 0x0
reported_buttons = 0x18
buttons = 0x20
skip_packet = 0x1
threshold = 0x4
motion = 0x8
position = 0xc
reported_position = 0x10
touch_count = 0x14
previous_touch = 0x1c
touch = 0x24

[constants]
WheelController_Ready = 1
WheelController_Acknowledge = 7
WheelPacket_Mask = 0xbc0000ff
WheelPacket_Value = 0x8000001a
WheelPacket_ButtonsMask = 0x8000ffff
WheelPacket_ButtonsValue = 0x8000023a
WheelButton_Center = 0x1
WheelButton_Next = 0x2
WheelButton_Previous = 0x4
WheelButton_Play = 0x8
WheelButton_Menu = 0x10
InputEvent_ButtonDown = 0x6
# The further button phases, named after the suffix the event name builder behind
# ScreenController_DispatchNamedEvent appends ("pressandhold", "longpressandhold", ...); a held button
# raises ButtonDown, then ButtonPressAndHold, and no ButtonUp. Every other kind is named "up".
InputEvent_ButtonPressAndHold = 0x8
InputEvent_ButtonLongPressAndHold = 0x9
InputEvent_ButtonDoubleClick = 0xa
InputEvent_ButtonDoubleClickAndHold = 0xb
InputEvent_ButtonTripleClick = 0xc
InputEvent_ButtonUp = 0xd
InputEvent_Wheel = 0x15
UIKey_Play = 0x10
UIKey_Previous = 0x59
UIKey_Next = 0x5a
UIKey_Menu = 0x6e
UIKey_Center = 0x6f
WheelPositions = 96
WheelTouch_Down = 0x40000000
WheelEvent_Signal = 5

[offsets.InputEvent]
kind = 0x4
wheel_delta = 0xc
wheel_speed = 0x14
key = 0x10

[offsets.WheelController]
status = 0xc
acknowledge = 0x14
packet = 0x18
