# Click wheel and buttons.

[functions]
Wheel_HandleInterrupt = { at = 0x0805f688 }
Wheel_RunTask = { at = 0x0805f738 }
Wheel_DispatchButtonChanges = { at = 0x0807443c, c = "int Wheel_DispatchButtonChanges(int force_center)" }
Input_HandleButton = { at = 0x08056900, c = "void Input_HandleButton(uint32_t button, uint32_t pressed)" }
HoldSwitch_NotifyRawChange = { at = 0x080c75f8 }
Event_Signal = { at = 0x0802cfa8, c = "void Event_Signal(uint32_t event)" }
IRQ_RestoreState = { at = 0x083924d8, c = "void IRQ_RestoreState(uint32_t cpsr)" }
IRQ_DisableSave = { at = 0x083924e0, c = "uint32_t IRQ_DisableSave(void)" }
InputWheel_AccumulateMotion = { at = 0x08093718 }
# Builds the "<source>.<key>.<kind>" name ScreenController_DispatchNamedEvent dispatches: the key code
# (bits 16 to 23 of InputEvent_key) is looked up in the UIKeyNames tables, the kind becomes the suffix
# (down, up, pressandhold, ...).
InputEvent_BuildName = { at = 0x0826c1b8 }

[sites]
HoldSwitch_NotifyRawChange_call = { at = 0x08055b44, kind = "call" }

[data]
WheelController = { at = 0x3c200000, c = "volatile uint32_t WheelController[]" }
WheelState = { at = 0x089d2b8c, c = "uint8_t WheelState[]" }
ButtonKeyCodes = { at = 0x089d2ec5, c = "const uint8_t ButtonKeyCodes[5]" }
# Zero-terminated UIKeyName pairs, one table per event source, read by InputEvent_BuildName.
UIKeyNames_Button = { at = 0x083e46d0, c = "const uint8_t UIKeyNames_Button[]" }
UIKeyNames_Remote = { at = 0x083e4710, c = "const uint8_t UIKeyNames_Remote[]" }
UIKeyNames_Video = { at = 0x083e47f8, c = "const uint8_t UIKeyNames_Video[]" }
UIKeyNames_Image = { at = 0x083e4868, c = "const uint8_t UIKeyNames_Image[]" }
UIKeyNames_Audio = { at = 0x083e48b0, c = "const uint8_t UIKeyNames_Audio[]" }
UIKeyNames_Mikey = { at = 0x083e4958, c = "const uint8_t UIKeyNames_Mikey[]" }
# The words of an event name: button, up, down, pressandhold, longpressandhold, doubleclick,
# doubleclickandhold, tripleclick, remote, video, image, audio, mikey, wheel.
InputEventNameWords = { at = 0x089d2e48, c = "const char *const InputEventNameWords[14]" }

[offsets.UIKeyName]
code = 0x0
name = 0x4
bytes = 0x8

[offsets.WheelState]
notify_pending = 0x0
reported_buttons = 0x18
buttons = 0x20
skip_packet = 0x1
threshold = 0x4
motion = 0x8
position = 0xc
reported_position = 0x10
touch_count = 0x14
previous_touch = 0x1c
touch = 0x24

[constants]
WheelController_Ready = 1
WheelController_Acknowledge = 7
WheelPacket_Mask = 0xbc0000ff
WheelPacket_Value = 0x8000001a
WheelPacket_ButtonsMask = 0x8000ffff
WheelPacket_ButtonsValue = 0x8000023a
WheelButton_Center = 0x1
WheelButton_Next = 0x2
WheelButton_Previous = 0x4
WheelButton_Play = 0x8
WheelButton_Menu = 0x10
InputEvent_ButtonDown = 0x6
# The further button phases, named after the suffix the event name builder behind
# ScreenController_DispatchNamedEvent appends ("pressandhold", "longpressandhold", ...); a held button
# raises ButtonDown, then ButtonPressAndHold, and no ButtonUp. Every other kind is named "up".
InputEvent_ButtonPressAndHold = 0x8
InputEvent_ButtonLongPressAndHold = 0x9
InputEvent_ButtonDoubleClick = 0xa
InputEvent_ButtonDoubleClickAndHold = 0xb
InputEvent_ButtonTripleClick = 0xc
InputEvent_ButtonUp = 0xd
InputEvent_Wheel = 0x15
# One key-code space for every input source; the source only picks the UIKeyNames table and the
# first word of the event name. The physical keys (UIKeyNames_Button) stay bare.
UIKey_Play = 0x10
UIKey_UpArrow = 0x57
UIKey_DownArrow = 0x58
UIKey_Previous = 0x59
UIKey_Next = 0x5a
UIKey_Menu = 0x6e
UIKey_Center = 0x6f
# Wired and dock remotes (UIKeyNames_Remote).
UIKey_RemotePlayPause = 0x1c
UIKey_RemotePrevious = 0x1d
UIKey_RemoteNext = 0x1e
UIKey_RemoteVolumeDown = 0x1f
UIKey_RemoteVolumeUp = 0x20
UIKey_RemoteEvent = 0x30
UIKey_RemoteNextAlbum = 0x38
UIKey_RemotePreviousAlbum = 0x39
UIKey_RemoteStop = 0x3a
UIKey_RemotePlay = 0x3b
UIKey_RemotePause = 0x3c
UIKey_RemoteMute = 0x3d
UIKey_RemoteNextChapter = 0x3e
UIKey_RemotePreviousChapter = 0x3f
UIKey_RemoteNextPlaylist = 0x40
UIKey_RemotePreviousPlaylist = 0x41
UIKey_RemoteShuffle = 0x42
UIKey_RemoteRepeat = 0x43
UIKey_RemoteOn = 0x44
UIKey_RemoteOff = 0x45
UIKey_RemoteBacklight = 0x46
UIKey_RemoteFastForward = 0x47
UIKey_RemoteRewind = 0x48
UIKey_RemoteMenu = 0x49
UIKey_RemoteCenter = 0x4a
UIKey_RemoteUpArrow = 0x4b
UIKey_RemoteDownArrow = 0x4c
UIKey_RemoteBacklightOff = 0x4d
# Image playback transport (UIKeyNames_Image).
UIKey_ImagePlayPause = 0x1
UIKey_ImageNext = 0x2
UIKey_ImagePrevious = 0x3
UIKey_ImageStop = 0x4
UIKey_ImagePlay = 0x5
UIKey_ImagePause = 0x6
UIKey_ImageShuffle = 0x7
UIKey_ImageRepeat = 0x8
# Video playback transport (UIKeyNames_Video).
UIKey_VideoPlayPause = 0x9
UIKey_VideoNext = 0xa
UIKey_VideoPrevious = 0xb
UIKey_VideoStop = 0xc
UIKey_VideoPlay = 0xd
