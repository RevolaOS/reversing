# agree with Rockbox firmware/export/s5l87xx.h and i2c-s5l8702.c.
PMU_I2CWriteAddress = 0xe6
PMU_BacklightEnableRegister = 0x29
PMU_BacklightEnabled = 1
PowerGate1_I2C0 = 0x10
I2C_ControlAck = 0x80
I2C_ControlInterrupts = 0x3f00
I2C_ControlContinue = 0x10
I2C_StatusMasterTransmit = 0xc0
I2C_StatusStart = 0x30
I2C_StatusBusy = 0x20
I2C_StatusNack = 1
I2C_ByteDone = 0x100
I2C_TransferDone = 0x2100
HardwareSource_DiskModeRequest = 0x8
HardwareSource_DiskGranted = 0x9
HardwareSource_HoldChanged = 0x6
AppMessage_DiskModeRequest = 0x63800003
AppMessage_DiskGranted = 0x63800004
AppMessage_HoldOn = 0x63800013
AppMessage_HoldOff = 0x63800014
ScsiDiskClientState_Refused = 0x0
ScsiDiskClientState_Pending = 0x1
ScsiDiskClientState_Granted = 0x2

[offsets.I2C0Controller]
