# AsyncFileIO: the Queue functions take a GameFileRequest whose type field must match (see
# GameFileRequest_*), build the path with GameFiles_BuildPath under the current game, and answer 1
# when queued. Writing, deleting and renaming need a writable directory kind (not Package or 4).
# The worker stores the result in GameFileRequest_result and hands the request back through the
# frame input list. Directory lists hold at most 500 entries. The GameSaveFile table keeps four
# in-memory files (GameSave_MaxSlots) capped at GameSave_MaxBytes together; Write replaces the
# contents, Read copies from memory (whence 0 absolute, 1 from the position; 5 at the end, 6 for
# a bad offset), and the files reach the disk at System_SaveAll and before the next game's init entry.
