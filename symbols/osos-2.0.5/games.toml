# Audio: the music player. Setters post a games-service event that the dispatcher applies on the
# UI task; the Get functions read the bridge's prediction when one is pending. Repeat modes are
# 0 off, 1 one, 2 all; speed is 500..2000; gain -32767..32767; volume 0..255. SetEQMenuIndex keeps
# the index, SetEQMenuIndexTemporary restores the old one when the game ends. The scan functions
# are the press-and-hold fast forward and rewind. SetListOption writes bit 2 of the playback list
# flags, SetPendingItem fills the player's pending-item record, GetPlayerFlag93F reads player byte
# 0x93f and GetCurrentEntryFlag bit 6 of the current entry's byte 0x18d; their meanings are
# unverified. GetMixerLevel and SetMixerLevel are the music level the duck restores. GetVersion
# writes 4 and 1. RequestPowerHold posts power message 6 as begin, then end after 10 s.
