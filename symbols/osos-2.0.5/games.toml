# The import modules of GameAPI_FindModuleByName. Each block is one module's function table in
# table order; the trailing comment gives the module and index the loader fills a stub from.
# miscTBD: backlight, sleep, clock, paths and device identity. SetBacklightLevel takes 0..100 and
# answers 0; SetBacklightEnabled answers 0 or 0xb when the PMU path is unavailable. SetBacklightDimmed
# caps the level at 20 while dimmed. GetDateTime fills second, minute, hour, day, month, year.
# GetHostStatusValue reads App member +0x430 through vtable +0xd0 and negates values above 22;
# its meaning is unverified. IsExternalPowerConnected is the check the sleep timer uses. GetPath
# and GetGameName copy into the caller's buffer and return the length, or -1 when it does not fit;
# GetGameName with localized nonzero prefers the manifest name for the current language.
# GetDeviceFamily maps the SysInfo board id: 0xb to 1, 0x14 to 2, 0x13 to 3, else 0.
# IsModelCode1 is true when the SysInfo model code is 1.
