# Audio: the music player. Setters post a games-service event that the dispatcher applies on the
# UI task; while events are queued the bridge predicts the playback state (GamePlaybackState_*),
# the entry count and the last volume payload, and GetPlaybackState and GetEntryCount read that
# prediction, while GetCurrentIndex, GetPosition and the Is* queries read the player directly and
# lag a queued command. Repeat modes GameRepeatMode_*, orders GamePlaybackOrder_* (3 asks the
# preference), speed 500..2000, gain -32767..32767, volume 0..GameAudio_VolumeMax; positions are
# milliseconds. SetEQMenuIndex keeps the index, SetEQMenuIndexTemporary restores the old one when
# the game ends; the scan functions are the press-and-hold fast forward and rewind.
# SetShuffleOrderBuilt writes MediaListFlags_ShuffleOrderBuilt (0 reshuffles at the next wrap),
# SetItemStartPosition tells the audio source where to start item index the next time it starts,
# IsPlayingOnTheGo says the playback list is the On-The-Go playlist, and
# IsPlaybackListUnrestricted is 1 unless the list carries MediaListOrderFlags_Restricted.
# GetMixerLevel and SetMixerLevel are the music level the duck restores. GetVersion writes 4 and 1.
# RequestPowerHold calls TaskMessage_PostBegin(6, 0), then TaskMessage_PostEndAfter(6, 10000).
