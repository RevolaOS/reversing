# OpenGLES: Apple's software OpenGL ES-CM 1.1 (GL_RENDERER "Software", vendor Hans-Martin Will, the
# Vincent rasteriser) and an EGL 1.1 whose eglQueryString version is "1.1.0 APPLE Software JIT". The
# GL entries follow the Khronos Common-Lite gl.h order with each float variant inserted next to its
# fixed twin (hence GetTexEnv iv, fv, xv; TexParameter i, f, x; ClipPlane x before f), without
# glColor4ub, glTexEnvi, glTexEnviv, glTexParameterfv, glTexParameteriv and glTexParameterxv.
# glCompressedTexSubImage2D and glGetTexParameterfv/xv only raise an error. glTexEnvx passes its
# scale values through unconverted, which fits the fixed variant; glTexParameteri and
# glTexParameterx share one body shape, so that split follows the table order. Each entry fetches
# the current context (eglGetCurrentContext) and does nothing without one. The EGL entries follow
# the egl.h 1.1 order: eglSurfaceAttrib, eglBindTexImage, eglReleaseTexImage and eglSwapInterval
# answer EGL_FALSE, eglGetCurrentDisplay answers 0, eglGetDisplay returns its argument,
# eglInitialize reports 1.0, eglChooseConfig picks from eight configs, eglCopyBuffers returns
# EGL_BAD_NATIVE_PIXMAP for a null target instead of setting the error. The last two GL entries
# carry the names EGL_ProcedureTable gives them. EGL_StoreSurfaceWord sits where egl.h puts
# eglGetProcAddress but stores its second argument at surface +0xa4; its purpose is unverified.
