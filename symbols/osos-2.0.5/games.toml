# SoundEffect: PCM samples mixed by the IRAM mixer. Create returns a handle (-1 when full) with
# 44100 Hz, one channel, 16 bits, volume 0x7fff, speed 1000 and play count 1; the setters answer 1
# on success. Speed is 500..2000 per mille, pan -0x7fff..0x7fff, play count 0 loops. Lead-in and
# tail are silences before the sound and before the chained next sound; SetMusicDuck lowers the
# mixer level to level over milliseconds while the sound plays. States are GameSoundState_*.
# GetSpeedScale answers 1000 and GetZero 0; Unused does nothing.
