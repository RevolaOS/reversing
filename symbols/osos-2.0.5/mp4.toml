# MP4 container parsing (M4A, M4B, ALAC) and the stream that seeks through it.

[functions]
# Clamps position_ms to MediaStream_duration_ms - MediaStream_SeekEndMarginMs, resets the track
# slots and seeks the parser through MediaParser_SeekToTime_method. Returns 0 or 1, 3 on error.
MediaStream_Seek = { at = 0x081db470, c = "int MediaStream_Seek(void *stream, uint32_t position_ms)" }
# Fails with 3 past MP4Parser_duration_ms; seeks the primary track, which may move position_ms,
# then the audio track to the result.
MP4Parser_SeekToTime = { at = 0x081bd1cc, c = "int MP4Parser_SeekToTime(void *parser, uint32_t position_ms)" }
# Walks MP4Parser_audio_track one sample per pass until its presentation time reaches position_ms;
# a backward target restarts from sample 1. Returns 0, 3 when a table window fails to load.
MP4Parser_SeekAudioTrack = { at = 0x081bb188, c = "int MP4Parser_SeekAudioTrack(void *parser, uint32_t position_ms)" }
# Same walk for the track kept inline in the parser; returns at once when it has no samples.
MP4Parser_SeekPrimaryTrack = { at = 0x081bb678, c = "int MP4Parser_SeekPrimaryTrack(void *parser, uint32_t *position_ms, uint32_t flags)" }
# Dispatches to the audio or primary track reader on its fourth argument.
MP4Parser_ReadSamples = { at = 0x081bb0f8 }
MP4Parser_ReadAudioTrackSamples = { at = 0x081bbed0 }
MP4Parser_ReadPrimaryTrackSamples = { at = 0x081bc644 }
# Window loaders for MP4Parser_audio_track: read MP4_*Window entries starting at first_index into
# the table's window buffer and record first_index. Sample sizes are skipped when every sample
# has the constant size.
MP4Parser_LoadSampleSizeWindow = { at = 0x081bac44, c = "int MP4Parser_LoadSampleSizeWindow(void *parser, uint32_t first_index)" }
MP4Parser_LoadSampleToChunkWindow = { at = 0x081bab1c, c = "int MP4Parser_LoadSampleToChunkWindow(void *parser, uint32_t first_index)" }
MP4Parser_LoadChunkOffsetWindow = { at = 0x081baaa0, c = "int MP4Parser_LoadChunkOffsetWindow(void *parser, uint32_t first_index)" }
# Seeks MP4Parser_file to the 64-bit offset and reads count big-endian words, byte-swapped.
MP4Parser_ReadBigEndianWords = { at = 0x081b940c, c = "int MP4Parser_ReadBigEndianWords(void *parser, uint32_t *buffer, uint32_t offset_low, uint32_t offset_high, uint32_t count)" }
# Loads the edit at MP4Track_edit_index into MP4Track_edit_media_start, _end and _duration, the
# duration converted from MP4Parser_movie_timescale to the track's; past the last edit the end
# becomes INT64_MAX.
MP4Parser_LoadTrackEdit = { at = 0x081ba664, c = "void MP4Parser_LoadTrackEdit(void *parser, void *track)" }
MP4Parser_LoadPrimaryTrackEdit = { at = 0x081ba708, c = "void MP4Parser_LoadPrimaryTrackEdit(void *parser)" }
# Unsigned 64-bit divide used for all timescale conversions.
Runtime_UDiv64 = { at = 0x08024024, c = "uint64_t Runtime_UDiv64(uint64_t numerator, uint64_t divisor)" }

[data]
MediaStream_vtable = { at = 0x08996bdc, c = "void *const MediaStream_vtable[]" }
MP4Parser_vtable = { at = 0x08994a58, c = "void *const MP4Parser_vtable[]" }

[sites]
# MediaStream_vtable + MediaStream_seek_method.
MediaStream_Seek_slot = { at = 0x08996c00, kind = "slot" }
# MP4Parser_vtable + MediaParser_seek_to_time_method.
MP4Parser_SeekToTime_slot = { at = 0x08994a68, kind = "slot" }

[offsets.MediaStream]
seek_method = 0x24
parser = 0x107c
duration_ms = 0x108c

# Methods every parser implementation provides; the MP4 one is MP4Parser_vtable.
[offsets.MediaParser]
seek_to_time_method = 0x10
read_samples_method = 0x14

[offsets.MP4Parser]
file = 0x8
duration_ms = 0x58
movie_timescale = 0x64
audio_track = 0x1b8
audio_fourcc = 0x1c0

# Times are 64-bit in the track's timescale. Sample, chunk and sample_in_chunk count from 1.
[offsets.MP4Track]
sample_sizes = 0xc
chunk_offsets = 0x10
sample_to_chunk = 0x14
time_to_sample = 0x18
edits = 0x1c
sample = 0x68
sample_to_chunk_index = 0x6c
chunk = 0x70
sample_in_chunk = 0x74
chunk_byte_offset = 0x78
timescale = 0x7c
time_to_sample_run = 0x84
presentation_time = 0x88
decode_time = 0x90
duration = 0x98
time_to_sample_index = 0xa0
edit_index = 0xa4
edit_media_start = 0xa8
edit_media_end = 0xb0
edit_duration = 0xb8

# stsz: constant_size is nonzero when every sample has it and the window is unused.
[offsets.MP4SampleSizeTable]
constant_size = 0x0
count = 0x4
window_first = 0x8
window = 0xc

# stco, stsc and stts share this head; stsc entries are 12 bytes, stts entries 8 (count, delta).
[offsets.MP4SampleTable]
count = 0x0
window_first = 0x4
window = 0x8

# elst: 24-byte entries, media time at +8.
[offsets.MP4EditList]
count = 0x0
entries = 0x4

[constants]
MediaStream_SeekEndMarginMs = 5000
MP4_SampleSizeWindow = 0x8000
MP4_SampleToChunkWindow = 0x8000
MP4_ChunkOffsetWindow = 0x4000
