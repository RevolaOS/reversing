ArtworkSession_Destroy = { at = 0x08222298, c = "void *ArtworkSession_Destroy(void *session)" }
# Registers cover formats 15 and 16 and stores the listener at ArtworkSession_listener; the session
# tail-calls (pop lr, bx) the listener's ArtworkSessionListener_cover_loaded_method as
# (listener, item, album_index) once a cover is loaded. Returns nonzero on success.
ArtworkSession_Attach = { at = 0x0821674c, c = "int ArtworkSession_Attach(void *session, void *listener)" }
ArtworkSession_SetFormat = { at = 0x08216a24, c = "int ArtworkSession_SetFormat(void *session, int format)" }
