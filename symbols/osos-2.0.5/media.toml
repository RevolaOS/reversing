# Cover Flow's artwork session: a worker loads a window of covers around a centre album from the
# bound source; PlaybackArtwork_GetImage returns only covers already loaded. Every function returns
# with pop pc, so Thumb callers need no veneer. Construct needs ArtworkSession_bytes of storage.
