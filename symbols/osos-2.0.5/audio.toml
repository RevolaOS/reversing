[offsets.AudioOutputQueue]
underruns_since_reset = 0x28
underruns = 0x2c

[offsets.ThreeBandEQ]
enable_method = 0x8
reset_method = 0x10
set_sample_rate_method = 0x14
process_method = 0x1c
sample_rate = 0x4
enabled = 0x8
stages = 0xc
preset = 0xb4
bytes = 0xb8

# Coefficients are signed Q8.24; history is x1, x2, y1, y2 for the left then the right channel.
[offsets.EQStage]
a1 = 0x0
a2 = 0x4
b0 = 0x8
b1 = 0xc
b2 = 0x10
history = 0x14
bypass = 0x34
bytes = 0x38

# EQ_Presets rows: string and preview image resource ids.
[offsets.EQPreset]
name = 0x0
preview = 0x4
bytes = 0x8

[offsets.AudioEffectsContext]
eq = 0x18034
# Format of the PCM handed to AudioOutputQueue_Write; Audio_InitEffectsChain sets 44100, 16, 2.
output_rate = 0x2a184
output_bits = 0x2a188
output_channels = 0x2a18c

[offsets.AudioMixer]
effects = 0x20

[offsets.MediaTrack]
state = 0x0
item = 0x4
record = 0xc
# The player's settings block; MediaPlayer_eq_settings_id is 5 bytes past it.
playback_settings = 0x20

