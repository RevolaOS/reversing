# Audio effects chain and EQ.

[functions]
EQ_LoadPresetCoefficients = { at = 0x082734c0, c = "void EQ_LoadPresetCoefficients(struct ThreeBandEQ *eq)" }
EQ_ResetAllBiquadStates = { at = 0x08273630, c = "void EQ_ResetAllBiquadStates(struct ThreeBandEQ *eq)" }
EQ_ResetBiquadState = { at = 0x08273594, c = "void EQ_ResetBiquadState(struct ThreeBandEQ *eq, uint32_t stage)" }
EQ_ProcessBiquadStereoS16 = { at = 0x08273658, c = "void EQ_ProcessBiquadStereoS16(struct ThreeBandEQ *eq, const int16_t *input, int16_t *output, uint32_t frames, uint32_t stage)" }
EQ_ProcessThreeBiquadsInPlace = { at = 0x082737fc, c = "void EQ_ProcessThreeBiquadsInPlace(struct ThreeBandEQ *eq, int16_t *input, uint32_t frames, int16_t **output, uint32_t *output_frames)" }
# Clamps presets above 22 to 0, reloads coefficients and resets the histories through reset_method.
EQ_SetDspPreset = { at = 0x082735c4, c = "void EQ_SetDspPreset(struct ThreeBandEQ *eq, uint32_t preset)" }
EQ_SetSampleRate = { at = 0x082735f4, c = "void EQ_SetSampleRate(struct ThreeBandEQ *eq, uint32_t rate_hz)" }
EQ_InitThreeBiquadState = { at = 0x08273858, c = "struct ThreeBandEQ *EQ_InitThreeBiquadState(struct ThreeBandEQ *eq)" }
EQ_SettingsIdToDspPreset = { at = 0x080b28a0, c = "uint32_t EQ_SettingsIdToDspPreset(uint32_t settings_id)" }
# Returns 0 and the index of settings_id in EQ_PresetIds, else -50 and index 0xffffffff.
EQ_SettingsIdToMenuIndex = { at = 0x080bb460, c = "int EQ_SettingsIdToMenuIndex(uint32_t settings_id, uint32_t *menu_index)" }
# EQ_PresetIds[menu_index] without a bounds check; -50 only when settings_id is NULL.
EQ_MenuIndexToSettingsId = { at = 0x0807bf94, c = "int EQ_MenuIndexToSettingsId(uint32_t menu_index, uint32_t *settings_id)" }
# Sends the DSP preset for the player's settings id to the audio task; a track's own id wins unless the
# player's is Flat. Only for tracks MediaTrack_IsReady accepts.
MediaTrack_ApplyEQ = { at = 0x08173b48, c = "void MediaTrack_ApplyEQ(struct MediaTrack *track)" }
# Load state 3 or 4.
MediaTrack_IsReady = { at = 0x0829394c, c = "int MediaTrack_IsReady(struct MediaTrack *track)" }
Audio_SetPlaybackSource = { at = 0x081a64c4, c = "void Audio_SetPlaybackSource(void *source)" }
Audio_InitEffectsChain = { at = 0x0818ced8 }
Audio_ProcessEffectsAndOutput = { at = 0x0818cbe0 }
Audio_SetPostEffectsGainQ15 = { at = 0x0818cec0 }
Audio_SetEQPreset = { at = 0x0818ca70, c = "void Audio_SetEQPreset(struct AudioEffectsContext *audio, uint32_t preset)" }
# IRAM. Returns the mixer that owns the effects contexts, creating it on the first call.
AudioMixer_Get = { at = 0x22007490, c = "void *AudioMixer_Get(void)" }
Audio_FillOutputBuffer = { at = 0x22007840 }
AudioOutputQueue_Read = { at = 0x22006b84 }
# IRAM. Returns AudioOutputQueue, allocating its 128 KiB ring on the first call.
AudioOutputQueue_Get = { at = 0x22006ea8, c = "void *AudioOutputQueue_Get(void)" }
# IRAM. Copies frames of S16 stereo into the ring, stores tag and ors flags into the touched 4 KiB
# pages; returns 0, or -1 without copying when less than frames * 4 bytes are free.
AudioOutputQueue_Write = { at = 0x22006f60, c = "int AudioOutputQueue_Write(void *queue, uint32_t unused, const int16_t *pcm, uint32_t frames, uint32_t unused2, uint32_t tag, uint32_t flags)" }
# DRAM thunks (ldr pc into the IRAM body); the BLs in Audio_ProcessEffectsAndOutput target these.
AudioOutputQueue_Get_thunk = { at = 0x0802d100, c = "void *AudioOutputQueue_Get_thunk(void)" }
AudioOutputQueue_Write_thunk = { at = 0x0802d220, c = "int AudioOutputQueue_Write_thunk(void *queue, uint32_t unused, const int16_t *pcm, uint32_t frames, uint32_t unused2, uint32_t tag, uint32_t flags)" }

