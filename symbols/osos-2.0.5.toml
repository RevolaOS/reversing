# Apple iPod Classic OSOS 2.0.5. Every address used by RevolaOS code comes from here.
# Functions are ARM state unless marked thumb = true. "c" is the C declaration; functions
# without one are only named so sites can refer to them.
# Sites are places the core patches; "in" names the containing function and offset.

[firmware]
version = "2.0.5"
osos_bytes = 10634496
osos_sha256 = "660eb6ff5f498bb1a75e85f1f9921bf0c753525a8bca9b4fa47ed260e5ad0f1e"
runtime_base = 0x08000000
runtime_file_offset = 0x0000b798
native_heap_base = 0x08b3b1b0

